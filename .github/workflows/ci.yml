name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: raydahub-test
  COMPOSE_FILE: docker-compose.yaml:compose/test.yaml
  POSTGRES_USER: test
  POSTGRES_DB: test
  POSTGRES_PORT: 15432

jobs:
  code:
    name: Code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: just check-ci

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      RAYDAHUB_IMAGE: raydahub:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.RAYDAHUB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: docker compose up -d --wait

      - name: Check app responds
        run: |
          for attempt in $(seq 30); do
            docker compose exec -T raydahub python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')" \
              && exit 0
            sleep 1
          done
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Start test database
        run: docker compose up -d --wait postgres

      - name: Run tests with coverage
        run: just test-cov

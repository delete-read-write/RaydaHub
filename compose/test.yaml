services:
  raydahub:
    secrets: !reset []
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: test

  postgres:
    secrets: !reset []
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_PASSWORD_FILE: ""
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
